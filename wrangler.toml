name = "relay-mcp"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain route. Co-located on tracklix.co since that zone is already on
# Cloudflare (pamplemoose.co is on Vercel DNS, so it cannot bind a Workers
# custom domain without a zone move). Wrangler auto-creates the CNAME on deploy.
routes = [
  { pattern = "relay-mcp.tracklix.co", custom_domain = true }
]

[observability]
enabled = true

# Secrets are set via `wrangler secret put <NAME>`. Do not commit values.
# Required secrets:
#   RELAY_API_KEY        Single shared key for v1 auth
#   SUPABASE_URL         e.g. https://<project>.supabase.co
#   SUPABASE_SERVICE_KEY Supabase service role key (never expose to clients)
