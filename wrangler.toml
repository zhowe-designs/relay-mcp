name = "relay-mcp"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Optional custom domain route. Replace with your own zone on Cloudflare, or
# remove the routes block entirely to deploy at the default workers.dev URL.
# Wrangler auto-creates the CNAME on deploy when the zone is on this account.
# routes = [
#   { pattern = "relay-mcp.example.com", custom_domain = true }
# ]

[observability]
enabled = true

# Secrets are set via `wrangler secret put <NAME>`. Do not commit values.
# Required secrets:
#   RELAY_API_KEY        Single shared key for v1 auth
#   SUPABASE_URL         e.g. https://<project>.supabase.co
#   SUPABASE_SERVICE_KEY Supabase service role key (never expose to clients)
